spring.application.name=smart-banking-system

# Server
server.port=8080

# ==============================
# MySQL Database Configuration
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/smart_banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root1234

# ==============================
# JPA / Hibernate Configuration
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# JWT Configuration
# ==============================

jwt.secret=SmartBankingSystemSecretKeyForJwtAuthentication2026Secure
jwt.expiration=86400000

# ==============================
# Logging
# ==============================

logging.level.org.springframework.security=INFO
logging.level.com.smartbanking=INFO
